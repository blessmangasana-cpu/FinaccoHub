services:
  postgres:
    image: postgres:15-alpine
    container_name: rse-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 3457
      POSTGRES_DB: RSE
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d RSE"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
