services:
  - type: cron
    name: rse-data-pipeline
    runtime: node
    plan: free
    schedule: "15 15 * * *"
    buildCommand: npm install && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rse_postgres
          property: connectionString
      - key: RSE_SCRAPE_URL
        value: https://www.rse.rw/market-data/equities
      - key: LOG_LEVEL
        value: info

databases:
  - name: rse_postgres
    databaseName: RSE
    user: rse_user
    plan: free
