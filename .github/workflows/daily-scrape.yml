name: Daily Scrape

on:
  schedule:
    # Runs at 15:15 UTC (17:15 Rwanda Time) Monday through Friday
    - cron: '15 15 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma generate
        
      - name: Apply Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy
        
      - name: Run Daily Scrape Job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          RSE_SCRAPE_URL: ${{ secrets.RSE_SCRAPE_URL }}
          NODE_ENV: production
        run: npm start

      - name: Upload Logs and Data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-data-and-logs-${{ github.run_number }}
          path: data/
          retention-days: 7
      
      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issue_body = `## ⚠️ Daily Scrape Job Failed
            
            **Workflow:** ${context.workflow}
            **Run Number:** ${context.runNumber}
            **Run URL:** ${runUrl}
            **Triggered by:** ${context.eventName}
            **Time:** ${new Date().toISOString()}
            
            Please check the logs for details.`;
            
            // Create an issue to track the failure
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Daily Scrape Failed - Run #${context.runNumber}`,
              body: issue_body,
              labels: ['bug', 'automated', 'scraper-failure']
            });
