name: Daily Scrape

on:
  schedule:
    # Runs at 15:15 UTC (17:15 Rwanda Time) Monday through Friday
    - cron: '15 15 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Collect Workflow Timing
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const workflowId = 'daily-scrape.yml';
            const defaultSchedule = '15 15 * * 1-5';
            const scheduleForDelay = context.payload.schedule || defaultSchedule;
            const [scheduleMinuteRaw, scheduleHourRaw] = scheduleForDelay.trim().split(/\s+/);
            const scheduleMinute = Number(scheduleMinuteRaw);
            const scheduleHour = Number(scheduleHourRaw);
            const outputDir = path.join(process.cwd(), 'data', 'workflow-timing');
            fs.mkdirSync(outputDir, { recursive: true });

            const formatKigali = (value) => {
              if (!value) return '';
              return new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Africa/Kigali',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
              }).format(new Date(value));
            };

            const expectedScheduleFor = (value) => {
              if (!value) return null;
              if (!Number.isInteger(scheduleMinute) || !Number.isInteger(scheduleHour)) return null;
              const actual = new Date(value);
              if (Number.isNaN(actual.getTime())) return null;

              const expected = new Date(Date.UTC(
                actual.getUTCFullYear(),
                actual.getUTCMonth(),
                actual.getUTCDate(),
                scheduleHour,
                scheduleMinute,
                0
              ));

              if (actual < expected) {
                expected.setUTCDate(expected.getUTCDate() - 1);
              }

              return expected;
            };

            const minutesBetween = (actual, expected) => {
              if (!actual || !expected) return null;
              return Math.round((new Date(actual).getTime() - expected.getTime()) / 60000);
            };

            const csvValue = (value) => {
              const text = value === null || value === undefined ? '' : String(value);
              return `"${text.replaceAll('"', '""')}"`;
            };

            const current = {
              workflow: context.workflow,
              run_id: context.runId,
              run_number: context.runNumber,
              event_name: context.eventName,
              configured_schedule: context.payload.schedule || null,
              schedule_used_for_delay: scheduleForDelay,
              collected_at_utc: new Date().toISOString(),
              collected_at_africa_kigali: formatKigali(new Date())
            };

            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              per_page: 30
            });

            const runs = response.data.workflow_runs.map((run) => {
              const actual = run.run_started_at || run.created_at;
              const expected = run.event === 'schedule' ? expectedScheduleFor(actual) : null;

              return {
                run_number: run.run_number,
                event: run.event,
                status: run.status,
                conclusion: run.conclusion,
                created_at_utc: run.created_at,
                run_started_at_utc: run.run_started_at || null,
                run_started_at_africa_kigali: formatKigali(actual),
                expected_schedule_utc: expected ? expected.toISOString() : null,
                delay_minutes: expected ? minutesBetween(actual, expected) : null,
                html_url: run.html_url
              };
            });

            fs.writeFileSync(
              path.join(outputDir, 'current-run.json'),
              JSON.stringify(current, null, 2),
              'utf8'
            );

            fs.writeFileSync(
              path.join(outputDir, 'recent-runs.json'),
              JSON.stringify(runs, null, 2),
              'utf8'
            );

            const columns = [
              'run_number',
              'event',
              'status',
              'conclusion',
              'created_at_utc',
              'run_started_at_utc',
              'run_started_at_africa_kigali',
              'expected_schedule_utc',
              'delay_minutes',
              'html_url'
            ];
            const csv = [
              columns.join(','),
              ...runs.map((run) => columns.map((column) => csvValue(run[column])).join(','))
            ].join('\n');
            fs.writeFileSync(path.join(outputDir, 'recent-runs.csv'), `${csv}\n`, 'utf8');

            const tableRows = runs.slice(0, 10).map((run) => [
              String(run.run_number),
              run.event,
              run.run_started_at_africa_kigali,
              run.expected_schedule_utc || '',
              run.delay_minutes === null ? '' : String(run.delay_minutes),
              run.conclusion || run.status
            ]);

            await core.summary
              .addHeading('Workflow timing')
              .addRaw(`Configured cron: ${current.configured_schedule || `${scheduleForDelay} (manual run)`}\n\n`)
              .addTable([
                [
                  { data: 'Run', header: true },
                  { data: 'Event', header: true },
                  { data: 'Started Africa/Kigali', header: true },
                  { data: 'Expected UTC', header: true },
                  { data: 'Delay min', header: true },
                  { data: 'Result', header: true }
                ],
                ...tableRows
              ])
              .write();
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma generate
        
      - name: Apply Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy
        
      - name: Run Daily Scrape Job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          RSE_SCRAPE_URL: ${{ secrets.RSE_SCRAPE_URL }}
          NODE_ENV: production
        run: npm start

      - name: Upload Logs and Data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrape-data-and-logs-${{ github.run_number }}
          path: data/
          retention-days: 7
      
      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issue_body = `## ⚠️ Daily Scrape Job Failed
            
            **Workflow:** ${context.workflow}
            **Run Number:** ${context.runNumber}
            **Run URL:** ${runUrl}
            **Triggered by:** ${context.eventName}
            **Time:** ${new Date().toISOString()}
            
            Please check the logs for details.`;
            
            // Create an issue to track the failure
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Daily Scrape Failed - Run #${context.runNumber}`,
              body: issue_body,
              labels: ['bug', 'automated', 'scraper-failure']
            });
